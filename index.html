<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PromptDocente · Caderno de Contexto — PROFCOMP-MA / UFMA</title>
    <meta
      name="description"
      content="Gerador de prompts pedagógicos fundamentado na BNCC para Educação Básica (Infantil, Fundamental, Médio Regular, Médio Técnico e EJA). Produto educacional desenvolvido no PROFCOMP-MA / UFMA."
    />
    <meta name="theme-color" content="#8D0333" />
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('cdc.tema');
        } catch (e) {}
        if (t !== 'claro' && t !== 'escuro') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'claro'
              : 'escuro';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
